<style>
/* Layout: "night glass" phone app — one column of glass cards, tab bar floating at the bottom; summary first, detail on tap */
:root{
  --bg:#030915; --text:#EAF1FF; --muted:#8D9DC2; --dim:#5D6C90;
  --glow-a:rgba(46,100,210,.38); --glow-b:rgba(30,70,160,.16); --glow-c:rgba(30,80,180,.22);
  --glass:linear-gradient(180deg,rgba(30,56,108,.40),rgba(12,26,56,.42)); --glass-flat:rgba(18,36,74,.45);
  --stroke:rgba(110,160,255,.15); --stroke-hi:rgba(125,180,255,.45);
  --accent:#3E8EFF; --accent-2:#79BEFF; --glow:rgba(62,142,255,.42); --on-accent:#fff;
  --seg-grad:linear-gradient(180deg,#2C70D8,#17489A);
  --bar:rgba(8,18,40,.82); --shadow:rgba(0,0,0,.25);
  --up:#3DDC97; --down:#FF5D5D; --warn:#FFB547; --none:#5D6C90;
  --f:"Inter","SF Pro Display","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-skin="noir"]{--bg:#000;--text:#F2F2F2;--muted:#9A9A9A;--dim:#616161;--glow-a:rgba(255,255,255,.08);--glow-b:rgba(255,255,255,.03);--glow-c:rgba(255,255,255,.05);
  --glass:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));--glass-flat:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.12);--stroke-hi:rgba(255,255,255,.38);
  --accent:#D9D9D9;--accent-2:#fff;--glow:rgba(255,255,255,.22);--seg-grad:linear-gradient(180deg,#3A3A3A,#1C1C1C);--bar:rgba(10,10,10,.85);--shadow:rgba(0,0,0,.4)}
:root[data-skin="gris"]{--bg:#1E2126;--text:#EEF1F5;--muted:#A3AAB6;--dim:#6C7380;--glow-a:rgba(200,210,225,.14);--glow-b:rgba(200,210,225,.05);--glow-c:rgba(200,210,225,.08);
  --glass:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));--glass-flat:rgba(255,255,255,.06);--stroke:rgba(220,228,240,.14);--stroke-hi:rgba(220,228,240,.40);
  --accent:#AEB8C8;--accent-2:#DCE3EE;--glow:rgba(200,212,230,.25);--seg-grad:linear-gradient(180deg,#5A6372,#3A414C);--bar:rgba(30,33,38,.88);--shadow:rgba(0,0,0,.3)}
:root[data-skin="blanc"]{--bg:#EEF2F8;--text:#0F1A33;--muted:#5B6884;--dim:#94A0B8;--glow-a:rgba(90,140,235,.20);--glow-b:rgba(90,140,235,.06);--glow-c:rgba(90,140,235,.12);
  --glass:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.75));--glass-flat:rgba(255,255,255,.78);--stroke:rgba(40,70,130,.12);--stroke-hi:rgba(47,111,224,.45);
  --accent:#2F6FE0;--accent-2:#2F6FE0;--glow:rgba(47,111,224,.28);--seg-grad:linear-gradient(180deg,#3B7CEB,#2357C4);--bar:rgba(255,255,255,.9);--shadow:rgba(30,60,120,.08);
  --up:#12A36B;--down:#E0413F;--warn:#D98A12;--none:#94A0B8;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--text);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 55% at 70% -8%,var(--glow-a),transparent 62%),radial-gradient(70% 40% at 0% 40%,var(--glow-b),transparent 70%),radial-gradient(90% 50% at 100% 105%,var(--glow-c),transparent 65%),var(--bg);
  background-color:var(--bg);background-attachment:fixed;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:10px}
a{color:var(--accent-2)}
.screen{max-width:520px;margin:0 auto;padding:20px 16px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.h1{font-size:27px;font-weight:400;letter-spacing:-.01em;margin:0}
.lead{color:var(--muted);font-size:13px;margin:3px 0 0}
.skins{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--glass-flat);border:1px solid var(--stroke)}
.skins button{width:18px;height:18px;border-radius:50%;border:1px solid var(--stroke-hi)}
.skins button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent-2)}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pad{padding:14px 16px}
.h2{font-size:17px;font-weight:500;margin:6px 2px 0;display:flex;align-items:center;gap:8px}
.h2 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:auto;text-align:right}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;padding:16px}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:300;margin-top:6px}
.hero p{margin:10px 0 0;font-size:14.5px}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.count{padding:10px 8px;text-align:center}
.count{cursor:pointer;width:100%;transition:box-shadow .2s,border-color .2s}
.count:hover{border-color:var(--stroke-hi)}
.count[aria-pressed="true"]{border-color:var(--stroke-hi);box-shadow:0 0 0 1px var(--stroke-hi),0 0 18px var(--glow)}
.count b{display:block;font-size:22px;font-weight:400}
.filterbar{display:flex;align-items:center;gap:10px;font-size:14px}
.filterbar .clear{margin-left:auto;padding:6px 12px;border-radius:999px;border:1px solid var(--stroke-hi);font-size:13px;white-space:nowrap}
.count span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .n{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:19px;font-weight:400}
.tile svg{width:100%;height:34px;margin-top:4px}
.tile .nohist{font-size:11px;color:var(--dim);margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.g{background:var(--up);box-shadow:0 0 8px var(--up)}
.dot.o{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.r{background:var(--down);box-shadow:0 0 8px var(--down)}
.dot.n{background:transparent;border:1.5px solid var(--none)}
.big .dot{width:16px;height:16px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
/* rows */
.list{padding:6px}
.row{width:100%;display:grid;grid-template-columns:14px 1fr auto 14px;gap:10px;align-items:center;padding:11px 10px;text-align:left;border-radius:12px}
.row+.row,.row+.detail+.row{border-top:1px solid var(--stroke)}
.row:hover{background:var(--glass-flat)}
.row .nm{min-width:0;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-size:15.5px;white-space:nowrap}
.row .v small{display:block;font-size:11.5px;color:var(--muted)}
.chev{color:var(--muted);transition:transform .2s}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:4px 12px 12px 34px;font-size:13px}
.detail dt{color:var(--muted)} .detail dd{margin:0}
.note{display:flex;gap:8px;padding:12px 14px;font-size:14px;border-radius:14px;background:var(--glass-flat);border:1px solid var(--stroke)}
.note b{font-weight:600}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:11px 12px}
.item+.item{border-top:1px solid var(--stroke)}
.item .dot{margin-top:5px}
.item b{font-weight:500;display:block}
.item span{color:var(--muted);font-size:13.5px}
.agenda{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:12px 14px;font-size:14px}
.agenda .t{color:var(--accent-2);font-variant-numeric:tabular-nums}
.lex dt{font-weight:500;margin-top:8px} .lex dd{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.src{font-size:12.5px;padding:12px 16px;margin:0;display:flex;flex-direction:column;gap:6px;list-style:none}
.banner{font-size:12.5px;color:var(--muted);padding:10px 14px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar-in{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%),var(--bar);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 40px rgba(0,0,0,.45)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:9px;font-weight:500;color:var(--muted);border-radius:999px;transition:background .25s,color .25s}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--text);background:var(--seg-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 16px var(--glow)}
:root[data-skin="blanc"] .tab[aria-selected="true"]{color:#fff}
.grid{display:flex;flex-direction:column;gap:14px}
.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.tools{display:flex;gap:8px;align-items:center}
.sizes{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass-flat);border:1px solid var(--stroke)}
.sizes button{display:flex;align-items:center;justify-content:center;width:30px;height:24px;border-radius:999px;color:var(--muted)}
.sizes button[aria-pressed="true"]{color:var(--on-accent);background:var(--seg-grad);box-shadow:0 0 10px var(--glow)}
:root[data-skin="blanc"] .sizes button[aria-pressed="true"]{color:#fff}
.sizes svg{width:15px;height:15px}
/* iPad grand écran : deux colonnes de sections, repères sur trois colonnes */
:root[data-layout="tablet"] .screen{max-width:1180px;padding-left:28px;padding-right:28px}
:root[data-layout="tablet"] .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
:root[data-layout="tablet"] .full{grid-column:1/-1}
:root[data-layout="tablet"] .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
:root[data-layout="tablet"] .hero .big{font-size:36px}
:root[data-layout="tablet"] .tabbar-in{max-width:900px}
:root[data-layout="tablet"] .h1{font-size:32px}
/* horaires */
.dot.c{background:var(--none);opacity:.55}
.hrs{padding:6px}
.hr{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:10px}
.hr+.hr{border-top:1px solid var(--stroke)}
.hr .nm{min-width:0;font-weight:500;font-size:14.5px}
.hr .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.hr .tm{text-align:right;font-size:15px;white-space:nowrap}
.hr .tm small{display:block;font-size:11.5px;color:var(--muted)}
.st-o{color:var(--up)} .st-p{color:var(--warn)} .st-c{color:var(--muted)}
.tl{padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.tl .ln{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center}
.tl .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tl .tr{position:relative;height:12px;border-radius:6px;background:var(--glass-flat)}
.tl .sg{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--accent);opacity:.75}
.tl .sg.on{background:var(--up);opacity:1;box-shadow:0 0 8px var(--up)}
.tl .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn);border-radius:1px}
.tl .ax{display:grid;grid-template-columns:92px 1fr;gap:8px}
.tl .ax div{display:flex;justify-content:space-between;color:var(--dim);font-variant-numeric:tabular-nums}
.clock{font-size:30px;font-weight:300}
.act{display:block;margin-top:4px;font-size:13px;color:var(--accent-2)}
.act::before{content:"→ ";}
.hz{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;border:1px solid var(--stroke-hi);font-size:11px;color:var(--muted);font-weight:400;vertical-align:1px}
.stk{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.stk+.stk{border-top:1px solid var(--stroke)}
.stk .nm{min-width:0;font-weight:500;font-size:14.5px}
.stk .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.stk .tk{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px}
.stk .px{text-align:right;white-space:nowrap;font-size:15px}
.stk .px small{display:block;font-size:11.5px;color:var(--muted)}
.press .item b a{color:inherit;text-decoration:none}
.press .item b a:hover{text-decoration:underline}
.srcb{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.02em;vertical-align:1px;border:1px solid var(--stroke-hi);color:var(--muted)}
.srcb.ft{color:#f2b98f;border-color:rgba(242,185,143,.45)}
.srcb.lt{color:#9cc3ff;border-color:rgba(156,195,255,.45)}
.pdate{display:block;margin-top:3px;font-size:11.5px;color:var(--dim)}
.stk .ext{grid-column:2/-1;min-width:0}
.stk .ext:empty{display:none}
.stk .ext .sub{display:block;font-size:11.5px;color:var(--dim)}
.stk .ev{display:flex;gap:2px 14px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.stk .ev b{font-weight:600}
.stk .ol{display:block;margin-top:5px;font-size:12.5px;line-height:1.45;color:var(--text)}
.tone{display:inline-block;margin-right:6px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;border:1px solid}
.tone.pos{color:var(--up);border-color:var(--up)}
.tone.neu{color:var(--muted);border-color:var(--stroke-hi)}
.tone.pru{color:var(--warn);border-color:var(--warn)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

4 mois", "d": "≈ +0,2 %", "last": 3735}], "note": "L'or se stabilise après sa chute d'hier (environ −3 %). Il a touché environ 3 693 $ ce matin, son plus bas depuis 14 mois, avant de remonter légèrement. Le répit reste fragile tant que le dollar et les taux montent."}, "crypto": {"rows": [{"id": "btc", "r": "g", "flag": "₿", "name": "Bitcoin", "value": "≈ 63 000 $", "sub": "", "d": "≈ −2 % (24 h)", "last": 63000}, {"id": "xrp", "r": "n", "flag": "✕", "name": "XRP", "value": "n.d.", "sub": "dernière valeur connue ≈ 0,98 $ (18/11)", "d": "n.d.", "last": 0.98}], "note": "Le Bitcoin reste sous 63 500 $, au plus bas depuis environ trois mois, freiné par la Fed et par les retraits des fonds Bitcoin américains. Mouvement du jour dans les seuils verts."}, "fx": {"rows": [{"id": "chfeur", "r": "g", "flag": "🇨🇭🇪🇺", "name": "CHF/EUR", "value": "1,0818", "sub": "1 franc = 1,0818 euro", "d": "+0,02 %", "last": 1.0818}, {"id": "chfusd", "r": "g", "flag": "🇨🇭🇺🇸", "name": "CHF/USD", "value": "1,1916", "sub": "1 franc = 1,1916 dollar · 1,217 début novembre", "d": "−0,04 %", "last": 1.1916}, {"id": "eurusd", "r": "g", "flag": "🇪🇺🇺🇸", "name": "EUR/USD", "value": "1,0989", "sub": "1 euro = 1,0989 dollar", "d": "−0,23 %", "last": 1.0989}], "note": "Valeurs du franc d'hier matin (pas de cours récent fiable trouvé). Le dollar est au plus haut depuis 19 mois après le compte rendu de la Fed."}}, "counterparty": [{"r": "o", "t": "Deutsche Bank : suite de l'affaire des documents fuités", "why": "Après −6 % mardi, l'action reste sous surveillance. Risque de réputation et d'amendes ; à suivre si ton entreprise traite avec elle (dérivés, prêt de titres)."}, {"r": "o", "t": "Assureurs santé US en forte baisse (UnitedHealth)", "why": "Inquiétudes réglementaires. Pas un risque de contrepartie direct, mais une pression sur les fonds actions US."}, {"r": "o", "t": "Pannes d'applications de plusieurs banques US (lundi)", "why": "Incident opérationnel signalé ; pas d'impact sur le règlement des titres connu à ce stade."}], "macro": {"rows": [{"r": "o", "t": "🇺🇸 Compte rendu de la Fed : d'autres hausses de taux jugées probables", "why": "Presque tous les membres jugent de nouvelles hausses appropriées ; quelques-uns envisagent plus de 0,25 % en décembre. Christopher Waller (Fed) a évoqué une hausse de 0,5 %."}, {"r": "o", "t": "🇺🇸 Probabilité de hausse en décembre : environ 96 %", "why": "La question n'est plus « si » mais « de combien »."}, {"r": "g", "t": "🇪🇺 Inflation zone euro définitive : 4,0 % (comme l'estimation)", "why": "Aucune surprise pour la BCE."}], "agenda": [{"time": "22h00", "t": "🇺🇸 Clôture de Wall Street (1re clôture d'Anthropic)"}, {"time": "Vendredi", "t": "Suite de la semaine : surveiller si le S&P 500 enchaîne une 7e baisse"}], "note": "Le message de la Fed est clair : les taux vont encore monter. C'est le principal facteur de pression actuel sur l'or, le Bitcoin et les actions sensibles aux taux."}, "risk": "Orange. La journée montre la fragilité du marché : même un événement très attendu (Anthropic) n'a pas suffi à enrayer la baisse. À surveiller : la clôture américaine et la volatilité d'Anthropic, qui pèse désormais lourd dans la tech.", "lexique": [{"term": "VIX / V2X", "def": "Indices qui mesurent l'ampleur des mouvements que le marché attend sur 30 jours. Plus ils sont hauts, plus la nervosité est forte."}, {"term": "Point de base (pb)", "def": "Un centième de pour cent : 0,25 % = 25 pb."}, {"term": "Futures", "def": "Contrats qui s'échangent presque 24 h/24 et donnent la tendance avant l'ouverture des bourses."}, {"term": "CDS", "def": "Assurance contre le défaut d'un émetteur. Son prix monte quand le marché doute de sa solidité."}, {"term": "Depuis 1er janv.", "def": "Variation depuis le début de l'année (« YTD » en anglais)."}], "sources": [{"title": "Yahoo Finance : Wall Street en direct", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-november-19-dow-sp-500-nasdaq-anthropic-ipo-090910916.html"}, {"title": "Newsbeep : séance US et bilan de novembre", "url": "https://www.newsbeep.com/us/922702/"}, {"title": "Benzinga : Walmart et S&P 500", "url": "https://www.benzinga.com/markets/equities/26/11/63446162/stock-market-today-anthropic-ipo-debut-sp-500-sixth-loss-november-19"}, {"title": "AP via Washington Times : Walmart", "url": "https://www.washingtontimes.com/news/2026/nov/19/early-rally-wall-street-evaporating-market-waits-anthropics-stock/"}, {"title": "Newsquawk : fin de séance européenne", "url": "https://www.newsquawk.com/headlines/newsquawk-european-market-wrap---19th-november-2026"}, {"title": "Trading Economics : indices européens", "url": "https://tradingeconomics.com/euro-area/stock-market"}, {"title": "AD HOC NEWS : SMI à midi", "url": "https://www.ad-hoc-news.de/boerse/news/marktberichte/smi-falls-0-43-prozent-by-midday-as-novartis-weighs/70535768"}, {"title": "CNN : Anthropic", "url": "https://www.cnn.com/2026/11/19/business/live-news/anthropic-ipo"}, {"title": "Trading Economics : or", "url": "https://tradingeconomics.com/commodity/gold"}, {"title": "ANC : or au plus bas depuis 14 mois", "url": "https://ancstockinvestments.com/blog/2026/11/19/gold-price-today-14-month-low-fed-minutes/"}, {"title": "Yahoo Finance : Hang Seng", "url": "https://finance.yahoo.com/quote/%5EHSI/"}], "cro": {"asof": "2026-11-19T20:05:00+01:00", "summary": "Vigilance renforcée. Le retournement de Wall Street le jour même de l'entrée en bourse d'Anthropic montre un marché nerveux, où les bonnes nouvelles ne suffisent plus à faire monter les cours. Fond inchangé : Fed ferme, dollar fort, tendance mondiale baissière. Aucun signal de défaut ni de blocage de liquidité.", "stress": [{"r": "o", "t": "Choc de taux : hausse de taux plus forte que prévu aux États-Unis", "why": "La Fed envisage plus de 0,25 % en décembre ; le taux US à 10 ans est vers 5,1 % et le taux à 2 ans a bondi de 17 pb en une séance le 10 novembre. Les fonds obligataires perdent de la valeur quand les taux montent.", "action": "Relancer le stress test taux sur les fonds obligataires et mixtes : choc +50 et +100 pb, pentification et aplatissement de la courbe. Vérifier la sensibilité (duration), les appels de marge sur futures et swaps de taux, et le collatéral disponible."}, {"r": "o", "t": "Liquidité et rachats des fonds obligataires", "why": "Sorties importantes des fonds obligataires hypothécaires américains (parmi les pires depuis 2021) et des fonds traditionnels au profit des ETF. Des taux qui montent peuvent déclencher des vagues de rachats.", "action": "Stress test de liquidité : scénarios de rachats (ex. 10 % et 20 % de l'actif sur 5 jours) contre la part d'actifs vendables vite, sans forte décote. Vérifier que les outils de gestion de liquidité (swing pricing, gates, seuils) sont prêts."}, {"r": "o", "t": "Dollar fort : couverture de change et collatéral", "why": "Le dollar est au plus haut depuis 19 mois. Les classes de parts couvertes en CHF ou EUR utilisent des contrats de change à terme : un dollar qui monte vite génère des pertes de couverture à régler en cash.", "action": "Simuler un choc dollar de +3 % et +5 % : besoins de cash pour les règlements des couvertures, appels de marge, et disponibilité du collatéral par fonds."}, {"r": "o", "t": "Or et matières premières en forte baisse", "why": "L'or a perdu environ 3 % hier et a touché environ 3 693 $ ce matin, son plus bas depuis 14 mois ; il a perdu environ un tiers depuis son record de janvier. L'argent et le cuivre reculent aussi.", "action": "Identifier les fonds exposés (or physique ou ETC, minières, matières premières) et appliquer un choc supplémentaire de −10 %. Vérifier les limites de concentration et de perte."}, {"r": "o", "t": "Concentration sur la tech et l'IA (effet Anthropic)", "why": "Anthropic a ouvert à 111,50 $ (+34 %, valorisation ≈ 2 000 milliards) puis a reculé vers 94–98 $ ; le reste de la tech a basculé dans le rouge. Une valeur de cette taille entrera vite dans les grands indices, et sa volatilité se transmettra aux fonds actions.", "action": "Stress test actions : choc −15 % à −20 % sur les valeurs IA et semi-conducteurs, −10 % sur le marché large. Vérifier la concentration par émetteur, l'exposition des fonds à l'introduction d'Anthropic, et l'écart de suivi des ETF actifs."}, {"r": "o", "t": "Contrepartie : Deutsche Bank", "why": "Fuite de documents internes et action en forte baisse (−6 % le 17 novembre). Pas de signal de défaut, mais un risque de réputation et d'amendes.", "action": "Recenser les expositions (dérivés de gré à gré, prêt de titres, mises en pension, dépôts), vérifier les accords de collatéral et suivre le prix de son CDS (assurance contre son défaut)."}], "escalate": [{"r": "o", "t": "Message clé : régime de taux en hausse confirmé par la Fed", "why": "Presque tous les membres de la Fed jugent d'autres hausses appropriées ; une hausse en décembre est quasi certaine (≈ 96 %). Les actions et les obligations peuvent baisser en même temps : la diversification habituelle protège moins.", "action": "Proposer au CRO : revue des limites de risque de marché et des scénarios de stress pour refléter ce régime."}, {"r": "o", "t": "Entrée en bourse d'Anthropic : sentiment IA et volatilité", "why": "Ouverture à 111,50 $ (+34 %), puis repli de plus de 15 % depuis ce plus haut dans la journée. Wall Street a chuté juste après sa première cotation (prises de bénéfices).", "action": "Informer le CRO de l'exposition directe (souscriptions éventuelles) et indirecte (fonds tech et IA), et suivre les premiers jours de cotation."}, {"r": "o", "t": "Résultats des stress tests taux, liquidité et change", "why": "Le CRO doit savoir quels fonds sont les plus sensibles avant la réunion de la Fed de décembre.", "action": "Lui remonter une synthèse : top 5 des fonds par sensibilité, dépassements éventuels de limites, besoins de collatéral."}, {"r": "o", "t": "Surveillance de contrepartie : Deutsche Bank", "why": "Sujet de réputation qui peut évoluer vite. Une mise sous surveillance formelle est un signal attendu d'une 2e ligne Risk.", "action": "Proposer une mise sous surveillance (watchlist) avec un point de situation sur les expositions."}, {"r": "o", "t": "Tendance de marché dégradée", "why": "Les trois grands indices américains perdent plus de 3 % en novembre, une première depuis 2008 selon Bespoke. Le S&P 500 se dirige vers une 6e baisse d'affilée ; l'indice mondial MSCI ACWI est au plus bas depuis avril.", "action": "Information au CRO ; préparer un point si les baisses continuent ou si le VIX dépasse 30 (seuil rouge)."}, {"r": "g", "t": "Rappel réglementaire FINMA", "why": "La FINMA a publié en juin 2026 la Communication 03/2026 sur les risques des produits en gestion de portefeuille (liquidité, valorisation, concentration, conflits d'intérêts) et met l'accent sur la gestion du risque de liquidité dans l'asset management.", "action": "Vérifier que la documentation des stress tests et des contrôles de liquidité est à jour en cas de demande du superviseur."}], "emerging": [{"r": "o", "t": "Crédit privé : décalage de liquidité", "horizon": "6–18 mois", "why": "Les autorités européennes (ESMA, EBA, EIOPA) en font une vulnérabilité clé à l'automne 2026 : des fonds de crédit privé peu liquides avec des rachats possibles pourraient transmettre un stress aux banques, surtout via les expositions aux États-Unis."}, {"r": "o", "t": "Dépendance aux prestataires externes et cyber", "horizon": "permanent", "why": "Les autorités européennes citent les dépendances externes et les cybermenaces parmi les vulnérabilités clés. La FINMA classe le cyber parmi les risques principaux. Pour un asset manager, cela touche les fournisseurs de données, le cloud et les dépositaires (règles DORA dans l'UE)."}, {"r": "o", "t": "Fin de la diversification actions/obligations", "horizon": "12–24 mois", "why": "Avec une inflation tenace et des taux qui montent, actions et obligations peuvent baisser ensemble. Les portefeuilles mixtes et les modèles de risque basés sur les corrélations passées peuvent sous-estimer les pertes."}, {"r": "o", "t": "Valorisations et concentration liées à l'IA", "horizon": "6–12 mois", "why": "L'IA est devenue la première crainte des gérants mondiaux (enquête BofA de novembre). Les grandes entrées en bourse (Anthropic aujourd'hui) testent l'appétit des investisseurs."}, {"r": "g", "t": "Glissement des fonds traditionnels vers les ETF", "horizon": "structurel", "why": "Aux États-Unis, sur une même semaine, environ 27 milliards de dollars sont entrés dans les ETF tandis qu'environ 80 milliards sont sortis des fonds traditionnels (monétaires compris). C'est un risque business (frais, parts de marché) plus qu'un risque de marché, mais il compte pour un asset manager."}, {"r": "g", "t": "Conduite et adéquation des produits", "horizon": "permanent", "why": "La FINMA place un nombre croissant de gestionnaires sous surveillance intensive pour des défauts d'adéquation (produits non adaptés au profil du client) et cible les produits maison et les conflits d'intérêts."}], "notes": {"stress": "Ces six sujets ne signifient pas qu'il y a un problème. Ils signifient que les marchés ont assez bougé pour que les résultats des derniers stress tests soient peut-être dépassés. L'objectif est de vérifier, fonds par fonds, que les limites et la liquidité tiennent avec des chocs mis à jour.", "escalate": "Au CRO, on remonte ce qui peut changer une décision : un changement de régime (taux), un résultat de stress test, une contrepartie à surveiller, ou une attente du régulateur. Le reste reste dans le suivi courant.", "emerging": "Ce sont des tendances de fond, pas des urgences. Elles servent à préparer la cartographie des risques et les scénarios des prochains mois. L'horizon indique quand le risque pourrait se matérialiser."}, "disclaimer": "Vue générique d'un asset manager, construite à partir des marchés et des publications des régulateurs. Elle ne connaît pas les positions réelles de ton entreprise : chaque point est une piste à vérifier avec les données internes. Ce n'est pas un conseil en investissement.", "sources": [{"title": "Yahoo Finance : Wall Street et Anthropic", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-november-19-dow-sp-500-nasdaq-anthropic-ipo-090910916.html"}, {"title": "Newsbeep : novembre, première depuis 2008", "url": "https://www.newsbeep.com/us/922702/"}, {"title": "Reuters via Yahoo : Anthropic et futures du Nasdaq", "url": "https://finance.yahoo.com/markets/stocks/articles/nasdaq-futures-jump-anthropics-record-090243474.html"}, {"title": "Bloomberg : MSCI ACWI et futures", "url": "https://www.bloomberg.com/news/articles/2026-11-18/stock-market-today-dow-s-p-live-updates"}, {"title": "ESAs : mise à jour des risques, automne 2026", "url": "https://esma.europa.eu/press-news/esma-news/esas-call-vigilance-over-external-dependencies-cyber-threats-and-private"}, {"title": "FINMA : conférence de presse annuelle 2026", "url": "https://www.finma.ch/en/documentation/finma-publications/addresses-and-specialist-articles/referate-folder/20260421-stefan-walter-jmk-2026/"}, {"title": "FINMA Communication 03/2026 (Grant Thornton)", "url": "https://www.grantthornton.ch/en/insights/finma-guidance-03-2026-individual-portfolio-management-risks/"}, {"title": "Enquête BofA auprès des gérants, novembre 2026", "url": "https://atranicapital.substack.com/p/november-2026-bank-of-america-global"}, {"title": "LSEG Lipper : flux des fonds US", "url": "https://lipperalpha.refinitiv.com/reports/2026/11/u-s-weekly-update-trick-or-hike-fed-holds-inflation-haunts-and-growth-suprises/"}, {"title": "Quartz : sorties des fonds obligataires hypothécaires", "url": "https://qz.com/us-mortgage-bond-fund-outflows-worst-since-2021-101226"}, {"title": "CNN : taux à 2 ans +17 pb le 10/11", "url": "https://www.cnn.com/2026/11/10/investing/bond-yields-inflation-fed"}]}, "stars": {"featured": {"r": "r", "title": "Anthropic (ANT)", "text": "Première cotation vers 17h50 (Genève) à 111,50 $, 34 % au-dessus du prix d'introduction (83 $), pour une valorisation d'environ 2 000 milliards de dollars. Plus haut du jour 114,99 $, plus bas 92,72 $ ; vers 21h20, l'action s'échangeait vers 96 $ (environ +16 %)."}, "groups": [{"id": "us_tech", "title": "Géants de la tech américaine", "asof": "Clôtures du 18/11 · variation du jour en séance le 19/11", "full": true, "note": "Le cours est la dernière clôture connue ; la variation du jour est celle de la séance du 19/11 quand elle était disponible (vers 17h). Sur une semaine, Nvidia chute de 13 % alors qu'Apple et Amazon restent stables ; sur un an, Apple (+32 %) et Amazon (+20 %) dominent, Nvidia et Tesla reculent. La ligne « Perspective » résume la tendance à court terme d'après l'actualité, ce n'est pas une recommandation.", "rows": [{"id": "aapl", "r": "n", "flag": "🇺🇸", "name": "Apple", "ticker": "AAPL", "yahoo": "AAPL", "last": 352.45, "cur": "$", "d": null, "fromHigh": -1.1, "scope": "iPhone, Mac, services · résiste le mieux", "w": -0.89, "y": 32.2, "ytd": 30.1, "sub": "Clôture du 18/11 · capitalisation ≈ 5 100 milliards $", "outlook": {"tone": "Neutre", "text": "Valeur refuge de la tech, tout près de son record et meilleure performance des « 7 » en 2026. Revers de la médaille : elle est chère (environ 39 fois ses bénéfices), donc sensible à une rotation."}}, {"id": "msft", "r": "g", "flag": "🇺🇸", "name": "Microsoft", "ticker": "MSFT", "yahoo": "MSFT", "last": 508.29, "cur": "$", "d": -0.66, "fromHigh": -8.9, "scope": "Logiciels et cloud Azure · partenaire d'Anthropic", "w": -2.46, "y": 3.8, "ytd": 5.8, "sub": "Clôture du 18/11 · variation du jour en séance (≈ 17h)", "outlook": {"tone": "Neutre", "text": "Partenaire et client d'Anthropic, porté par le cloud Azure. Le titre a reculé d'environ 4 % en un mois avec la défiance envers les dépenses dans l'IA."}}, {"id": "nvda", "r": "g", "flag": "🇺🇸", "name": "Nvidia", "ticker": "NVDA", "yahoo": "NVDA", "last": 150.96, "cur": "$", "d": -1.64, "fromHigh": -36.9, "scope": "Puces pour l'IA · secoué par une affaire visant son patron", "w": -13.11, "y": -16.6, "ytd": -18.9, "sub": "Clôture du 18/11 · variation du jour en séance (≈ 17h)", "outlook": {"tone": "Prudent", "text": "Ventes trimestrielles en hausse de 103 %, mais l'action a perdu environ 30 % en un mois après le départ forcé de son patron. Volatilité forte à court terme ; valorisation désormais plus basse (≈ 19 fois les bénéfices)."}}, {"id": "googl", "r": "g", "flag": "🇺🇸", "name": "Alphabet (Google)", "ticker": "GOOGL", "yahoo": "GOOGL", "last": 282.44, "cur": "$", "d": -0.55, "fromHigh": -29.8, "scope": "Recherche, YouTube, cloud · investisseur dans Anthropic", "w": -3.75, "y": -0.4, "ytd": -9.6, "sub": "Clôture du 18/11 · variation du jour en séance (≈ 17h)", "outlook": {"tone": "Neutre", "text": "Investisseur dans Anthropic, l'action a bondi à l'ouverture puis s'est repliée. Valorisation la plus basse des « 7 » (≈ 15 fois les bénéfices), mais doutes sur la recherche Google face à l'IA."}}, {"id": "amzn", "r": "g", "flag": "🇺🇸", "name": "Amazon", "ticker": "AMZN", "yahoo": "AMZN", "last": 267.74, "cur": "$", "d": -2.65, "fromHigh": null, "scope": "Commerce en ligne, cloud AWS · investisseur dans Anthropic", "w": 0.59, "y": 20.3, "ytd": 16.0, "sub": "Clôture du 18/11 · variation du jour en séance (≈ 17h)", "outlook": {"tone": "Neutre", "text": "Autre grand investisseur dans Anthropic et premier fournisseur de cloud (AWS). Bonne année (+20 %), mais l'action a rendu ses gains du matin."}}, {"id": "meta", "r": "n", "flag": "🇺🇸", "name": "Meta", "ticker": "META", "yahoo": "META", "last": 616.38, "cur": "$", "d": null, "fromHigh": -21.7, "scope": "Facebook, Instagram, WhatsApp", "w": null, "y": 3.5, "ytd": -6.4, "sub": "Clôture du 18/11", "outlook": {"tone": "Prudent", "text": "Environ 22 % sous son record d'août : les investisseurs s'inquiètent du coût de ses investissements dans l'IA. Valorisation modérée (≈ 21 fois les bénéfices)."}}, {"id": "tsla", "r": "g", "flag": "🇺🇸", "name": "Tesla", "ticker": "TSLA", "yahoo": "TSLA", "last": 377.9, "cur": "$", "d": -1.52, "fromHigh": null, "scope": "Voitures électriques, robotique", "w": -1.82, "y": -4.4, "ytd": -14.7, "sub": "Cours en séance le 19/11 · 1 sem. à la clôture du 18/11", "outlook": {"tone": "Prudent", "text": "En baisse depuis janvier (≈ −15 %) et très chère (plus de 400 fois ses bénéfices) : l'action dépend surtout des promesses sur la robotique et la conduite autonome."}}, {"id": "avgo", "r": "n", "flag": "🇺🇸", "name": "Broadcom", "ticker": "AVGO", "yahoo": "AVGO", "last": 347.01, "cur": "$", "d": null, "fromHigh": null, "scope": "Puces et réseaux pour l'IA · partenaire d'Anthropic", "w": null, "y": null, "ytd": null, "sub": "Dernière clôture trouvée : 13/11 · plage sur 1 an : 290–495 $", "outlook": {"tone": "Positif", "text": "51 analystes la recommandent en moyenne à l'achat (« Strong Buy »), avec un objectif moyen d'environ 529 $ à 12 mois. Partenaire d'Anthropic pour les puces."}}]}, {"id": "ia_new", "title": "Nouvelles cotations IA", "asof": "En séance, vers 19h (Genève)", "note": "Pas encore d'historique sur 1 semaine ni 1 an : l'action cote depuis aujourd'hui. Elle a ouvert à 111,50 $ puis s'est stabilisée vers 96 $, encore environ 16 % au-dessus du prix d'introduction.", "rows": [{"id": "ant", "r": "r", "flag": "🇺🇸", "name": "Anthropic", "ticker": "ANT", "yahoo": "ANT", "last": 96.18, "cur": "$", "d": 15.88, "fromHigh": null, "scope": "Créateur de l'assistant IA Claude", "sub": "Cours en séance (≈ 21h20) · ouverture 111,50 $ · fourchette 92,72–114,99 $ · variation vs prix d'introduction (83 $)", "w": null, "y": null, "ytd": null, "outlook": {"tone": "Prudent", "text": "Premiers jours généralement très volatils après une introduction. Les banques qui ont organisé l'opération ne publient leurs premières analyses qu'après une période de silence (environ 25 jours, donc vers mi-décembre)."}}]}, {"id": "suisse", "title": "Géants suisses", "asof": "En séance, vers 11h30 (Genève)", "note": "La Bourse suisse recule légèrement (SMI ≈ −0,4 %), freinée par la pharma : Novartis perd environ 2,6 % malgré la confirmation de ses objectifs de croissance, Nestlé environ 1,4 %. ABB monte. Ces valeurs défensives avaient porté le SMI à un record au-dessus de 15 000 points la semaine dernière. Évolutions sur 1 semaine et 1 an pas encore disponibles pour les valeurs suisses ; la version GitHub les calculera automatiquement.", "rows": [{"id": "nesn", "r": "g", "flag": "🇨🇭", "name": "Nestlé", "ticker": "NESN", "yahoo": "NESN.SW", "last": null, "cur": "CHF", "d": -1.4, "fromHigh": null, "scope": "Alimentation · Vevey", "w": null, "y": null}, {"id": "novn", "r": "g", "flag": "🇨🇭", "name": "Novartis", "ticker": "NOVN", "yahoo": "NOVN.SW", "last": null, "cur": "CHF", "d": -2.6, "fromHigh": null, "scope": "Pharma · Bâle · plus forte baisse du SMI", "w": null, "y": null}, {"id": "rog", "r": "g", "flag": "🇨🇭", "name": "Roche", "ticker": "ROG", "yahoo": "RO.SW", "last": null, "cur": "CHF", "d": -0.6, "fromHigh": null, "scope": "Pharma et diagnostic · Bâle", "w": null, "y": null}, {"id": "ubsg", "r": "n", "flag": "🇨🇭", "name": "UBS", "ticker": "UBSG", "yahoo": "UBSG.SW", "last": null, "cur": "CHF", "d": null, "fromHigh": null, "scope": "Banque et gestion de fortune · Zurich", "w": null, "y": null}, {"id": "abbn", "r": "g", "flag": "🇨🇭", "name": "ABB", "ticker": "ABBN", "yahoo": "ABBN.SW", "last": null, "cur": "CHF", "d": 2.59, "fromHigh": null, "scope": "Électrification et automatisation · valeur vers 9h45", "w": null, "y": null}]}, {"id": "europe", "title": "Géants européens", "asof": "Données du jour non trouvées", "note": "Pas de cours fiable trouvé aujourd'hui pour ces valeurs. ASML, la plus grosse capitalisation d'Europe, est en correction (plus de 10 % sous son récent plus haut) avec les doutes sur l'IA. La version GitHub du Radar remplira ces lignes automatiquement.", "rows": [{"id": "asml", "r": "n", "flag": "🇳🇱", "name": const GVA = "Europe/Zurich";
function tzOff(tz, ms) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"}).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000;
}
function ymd(tz, ms) { const d = new Date(ms + tzOff(tz, ms)); return [d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()]; }
function at(tz, y, m, d, hm) {
  const [h, mi] = hm.split(":").map(Number), g = Date.UTC(y, m, d, h, mi);
  return g - tzOff(tz, g - tzOff(tz, g));
}
function sessDay(ex, y, m, d) {
  const wd = new Date(Date.UTC(y, m, d)).getUTCDay();
  if (!(ex.days || WK).includes(wd)) return [];
  return ex.s.map(([o, c]) => [at(ex.tz, y, m, d, o), at(ex.tz, y, m, d, c)]);
}
function sessAround(ex, ms, from = -1, to = 8) {
  const [y, m, d] = ymd(ex.tz, ms), out = [];
  for (let k = from; k <= to; k++) { const dd = new Date(Date.UTC(y, m, d + k)); out.push(...sessDay(ex, dd.getUTCFullYear(), dd.getUTCMonth(), dd.getUTCDate())); }
  return out.sort((a, b) => a[0] - b[0]);
}
const gHM = ms => new Intl.DateTimeFormat("fr-CH", {timeZone: GVA, hour: "2-digit", minute: "2-digit"}).format(new Date(ms)).replace(":", "h");
const gDayKey = ms => ymd(GVA, ms).join("-");
function dayTag(ms, now) {
  const a = ymd(GVA, ms), b = ymd(GVA, now), diff = Math.round((Date.UTC(...a) - Date.UTC(...b)) / 864e5);
  if (diff === 0) return "";
  if (diff === 1) return " (demain)";
  if (diff === -1) return " (hier)";
  return " (" + new Intl.DateTimeFormat("fr-CH", {timeZone: GVA, weekday: "short"}).format(new Date(ms)) + ")";
}
function dur(ms) { const m = Math.round(ms / 6e4), h = Math.floor(m / 60); return h ? `${h} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }
function exStatus(ex, now) {
  const ss = sessAround(ex, now);
  const cur = ss.find(([a, b]) => now >= a && now < b);
  if (cur) return {k: "o", lab: "Ouverte", sub: "ferme dans " + dur(cur[1] - now)};
  const nxt = ss.find(([a]) => a > now), prv = [...ss].reverse().find(([, b]) => b <= now);
  if (nxt && prv && ymd(ex.tz, nxt[0]).join() === ymd(ex.tz, prv[1]).join()) return {k: "p", lab: "Pause midi", sub: "reprend dans " + dur(nxt[0] - now)};
  return {k: "c", lab: "Fermée", sub: nxt ? "ouvre dans " + dur(nxt[0] - now) : ""};
}
function exHours(ex, now) {
  // séances du prochain jour de bourse local (ou du jour en cours)
  const ss = sessAround(ex, now, 0, 8);
  const first = ss.find(([, b]) => b > now) || ss[0];
  const key = ymd(ex.tz, first[0]).join(), day = ss.filter(([a]) => ymd(ex.tz, a).join() === key);
  const open = day[0][0], close = day[day.length - 1][1];
  const pause = day.length > 1 ? day.slice(1).map((s, i) => `${gHM(day[i][1])}–${gHM(s[0])}`).join(", ") : "";
  return {open, close, pause};
}
function timeline(now) {
  const [y, m, d] = ymd(GVA, now), t0 = at(GVA, y, m, d, "00:00"), dn = new Date(Date.UTC(y, m, d + 1)), t1 = at(GVA, dn.getUTCFullYear(), dn.getUTCMonth(), dn.getUTCDate(), "00:00"), span = t1 - t0;
  const pct = v => ((v - t0) / span * 100).toFixed(2);
  const pick = [["Wellington", "Auckland"], ["Sydney"], ["Tokyo"], ["Chine"], ["Hong Kong"], ["Mumbai"], ["Riyad"], ["Zurich"], ["Londres"], ["New York"], ["São Paulo"]];
  const ALL = EXCH.flatMap(g => g.list);
  const rows = pick.map(([c, lb = c]) => {
    const ex = ALL.find(e => e.c === c), f = ex.f;
    const segs = sessAround(ex, t0 + span / 2, -2, 2).map(([a, b]) => [Math.max(a, t0), Math.min(b, t1)]).filter(([a, b]) => b > a);
    return `<div class="ln"><span class="lb">${f} ${esc(lb)}</span><div class="tr">${segs.map(([a, b]) => `<i class="sg ${now >= a && now < b ? "on" : ""}" style="left:${pct(a)}%;width:${(pct(b) - pct(a)).toFixed(2)}%"></i>`).join("")}<i class="now" style="left:${pct(now)}%"></i></div></div>`;
  }).join("");
  return `<div class="card tl">${rows}<div class="ax"><span></span><div><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div></div></div>`;
}
VIEWS.horaires = function () {

  const all = EXCH.flatMap(g => g.list), st = all.map(e => exStatus(e, now)), nOpen = st.filter(s => s.k === "o").length;

    return `<div class="hr"><i class="dot ${s.k === "o" ? "g" : s.k === "p" ? "o" : "c"}" aria-hidden="true"></i><span class="nm">${e.f} ${esc(e.n)}<small>${esc(e.c)} · ${esc(e.i)}${e.days ? " · dim. au jeu." : ""}${e.approx ? " · horaires approximatifs" : ""}</small><small class="st-${s.k}">${s.lab}${s.sub ? " · " + s.sub : ""}</small></span><span class="tm num">${gHM(h.open)}–${gHM(h.close)}<small>${h.pause ? "pause " + h.pause : "sans pause"}${dayTag(h.open, now)}</small></span></div>`; }).join("")}</div>`;
  return blk(`<div class="card hero"><div class="lbl">Heure de Genève</div><div class="clock num">${esc(clock)}</div><p>${nOpen ? `<b>${nOpen}</b> bourse${nOpen > 1 ? "s" : ""} ouverte${nOpen > 1 ? "s" : ""} sur ${all.length}.` : "Aucune bourse ouverte pour l'instant."}${nextOpen ? ` Prochaine ouverture : ${nextOpen.e.f} ${esc(nextOpen.e.c)} à ${gHM(nextOpen.s[0])}${dayTag(nextOpen.s[0], now)}.` : ""}</p></div>`, "full")
    + blk(`<h2 class="h2">La journée en un coup d'œil <small>heure de Genève</small></h2>${timeline(now)}${note(`Chaque barre montre quand une bourse est ouverte, en heure de Genève. Le trait orange est l'heure actuelle, et les barres vertes sont les bourses ouvertes en ce moment. La journée commence en Asie-Pacifique pendant notre nuit, continue en Europe de 9h à 17h30, puis se termine à Wall Street jusqu'à 22h. Aujourd'hui, Europe et États-Unis sont ouverts en même temps de ${gHM(ny.open)} à 17h30 : c'est souvent le moment où les marchés bougent le plus.`)}`, "full")
    + EXCH.map(gr => blk(`<h2 class="h2">${esc(gr.reg)} <small>ouverture–fermeture, heure de Genève</small></h2>${table(gr.list)}${note(gr.note)}`)).join("")
    + blk(`<h2 class="h2">Marchés en continu</h2><div class="card hrs">${cont.map(c => `<div class="hr"><i class="dot g" aria-hidden="true"></i><span class="nm">${c.f} ${esc(c.n)}<small>${esc(c.sub)}</small></span><span class="tm">${esc(c.tm)}<small class="num">${esc(c.tmsub)}</small></span></div>`).join("")}</div>${note("Les devises, les contrats à terme (futures) et les cryptomonnaies s'échangent presque sans arrêt. C'est pour cela que le franc ou le Bitcoin peuvent bouger la nuit ou le week-end, même quand toutes les bourses sont fermées.")}`)

/* live data: data/latest.json + data/history.json, written by scripts/update.py (GitHub Actions) */
async function loadData() {
  try {
    const bust = "?t=" + Date.now();
    const [h, l] = await Promise.all([
      fetch("data/history.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch("data/latest.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    const docs = (Array.isArray(h) ? h : []).filter(d => d && d.ts && d.indices).sort((a, b) => b.ts.localeCompare(a.ts));
    if (l && l.ts && (!docs.length || l.ts > docs[0].ts)) docs.unshift(l);
    if (!docs.length) return;
    HIST = docs.slice(0, 60); S = HIST[0];
    render();
  } catch (e) { /* keep the embedded snapshot */ }
}
loadData();
setInterval(loadData, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadData(); });
